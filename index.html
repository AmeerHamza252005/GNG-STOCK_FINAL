  if(!v) return;
  state.modal = ()=> `
  <div class="overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-head">
        <h3>${type==='manufactured'?'Add Manufactured Stock':'Send Stock'}</h3>
        <button class="modal-close" id="modalCloseBtn">${iconClose()}</button>
      </div>
      <div class="dim" style="font-size:13px;margin-bottom:4px;">${esc(p.name)}${(p.variants||[]).length>1?` — ${esc(variantLabel(v))}`:''}</div>
      <div class="faint" style="font-size:12px;margin-bottom:10px;">Currently ${v.qty||0} ${esc(p.unit||'units')} in stock</div>
      <div class="stepper">
        <button type="button" id="qtyMinus">−</button>
        <input type="number" id="qtyInput" value="1" min="1">
        <button type="button" id="qtyPlus">+</button>
      </div>
      <div class="field">
        <label>${type==='manufactured'?'Note (optional)':'Sent to / reason (optional)'}</label>
        <input id="modalNote" type="text" placeholder="${type==='manufactured'?'e.g. Batch #22 finished':'e.g. Order #4021 — Acme Co.'}">
      </div>
      <button class="btn ${type==='manufactured'?'btn-teal':'btn-primary'}" id="confirmStockBtn">
        ${type==='manufactured'?'Confirm Add':'Confirm Send'}
      </button>
    </div>
  </div>`;
  render();
  bindModal(type, p, v);
}
function closeModal(){ state.modal = null; render(); }
function bindModal(type, p, v){
  const overlay = document.getElementById('modalOverlay');
  overlay.addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  const qtyInput = document.getElementById('qtyInput');
  document.getElementById('qtyMinus').addEventListener('click', ()=>{ qtyInput.value = Math.max(1, (+qtyInput.value||1)-1); });
  document.getElementById('qtyPlus').addEventListener('click', ()=>{ qtyInput.value = (+qtyInput.value||1)+1; });
  document.getElementById('confirmStockBtn').addEventListener('click', async ()=>{
    const amount = Math.max(1, parseInt(qtyInput.value,10)||1);
    const note = document.getElementById('modalNote').value.trim();
    if(type==='sent' && amount > (v.qty||0)){
      toast(`Only ${v.qty||0} in stock — can't send ${amount}`, 'error');
      return;
    }
    v.qty = type==='manufactured' ? (v.qty||0) + amount : (v.qty||0) - amount;
    p.updatedAt = Date.now();
    const multi = (p.variants||[]).length>1;
    state.history.push({
      id: uid('h'), productId: p.id, variantId: v.id, variantLabel: multi ? variantLabel(v) : '',
      productName: p.name, sku: p.sku||'',
      productImage: p.image||'',
      type, qty: amount, resultingQty: v.qty, note,
      user: state.currentUser.name, username: state.currentUser.username,
      timestamp: Date.now()
    });
    const ok = await saveStock();
    closeModal();
    if(ok){
      toast(type==='manufactured' ? `Added ${amount} ${p.unit||'units'}` : `Sent ${amount} ${p.unit||'units'}`, 'success');
    } else {
      toast("Saved on this device, but couldn't sync — tap Retry sync at the top", 'error');
    }
    render();
  });
}

/* =========================================================
   CONFIRM MODAL (replaces window.confirm — many embedded
   webviews block native dialogs, which made buttons that
   relied on confirm() silently do nothing)
   ========================================================= */
function openConfirmModal(opts){
  const { title, message, confirmLabel, danger, onConfirm } = opts;
  state.modal = ()=> `
  <div class="overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-head">
        <h3>${esc(title)}</h3>
        <button class="modal-close" id="modalCloseBtn">${iconClose()}</button>
      </div>
      <div class="dim" style="font-size:14px;line-height:1.55;margin-bottom:18px;">${esc(message)}</div>
      <div class="action-row" style="margin-bottom:0;">
        <button class="btn btn-outline" id="confirmCancelBtn">Cancel</button>
        <button class="btn ${danger?'btn-danger':'btn-primary'}" id="confirmOkBtn">${esc(confirmLabel||'Confirm')}</button>
      </div>
    </div>
  </div>`;
  render();
  const overlay = document.getElementById('modalOverlay');
  overlay.addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('confirmCancelBtn').addEventListener('click', closeModal);
  document.getElementById('confirmOkBtn').addEventListener('click', async (e)=>{
    const btn = e.currentTarget; btn.disabled = true;
    await onConfirm();
  });
}

      <div class="stepper">

        <input type="number" id="qtyInput" value="1" min="1">
        <button type="button" id="qtyPlus">+</button>
      </div>
      <div class="field">
        <label>Note (optional)</label>
        <input id="modalNote" type="text" placeholder="e.g. Needed for order #4021">
      </div>
      <button class="btn btn-primary" id="confirmRequestBtn">${iconSend()} Send Request</button>
    </div>
  </div>`;
  render();
  bindRequestModal(p);
}
function bindRequestModal(p){
  const variants = p.variants||[];
  const overlay = document.getElementById('modalOverlay');
  overlay.addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  const qtyInput = document.getElementById('qtyInput');
  document.getElementById('qtyMinus').addEventListener('click', ()=>{ qtyInput.value = Math.max(1, (+qtyInput.value||1)-1); });
  document.getElementById('qtyPlus').addEventListener('click', ()=>{ qtyInput.value = (+qtyInput.value||1)+1; });
  const reqVariant = document.getElementById('reqVariant');
  const reqVariantWrap = document.getElementById('reqVariantSelect');
  if(reqVariantWrap){
    const trigger = document.getElementById('reqVariantTrigger');
    const menu = document.getElementById('reqVariantMenu');
    const current = document.getElementById('reqVariantCurrent');
    const closeMenu = ()=>{ reqVariantWrap.classList.remove('open'); menu.hidden = true; };
    const openMenu = ()=>{ reqVariantWrap.classList.add('open'); menu.hidden = false; };
    trigger.addEventListener('click', (e)=>{ e.stopPropagation(); menu.hidden ? openMenu() : closeMenu(); });
    menu.querySelectorAll('.variant-select-option').forEach(opt=>{
      opt.addEventListener('click', ()=>{
        const vid = opt.dataset.vid;
        reqVariant.value = vid;
        menu.querySelectorAll('.variant-select-option').forEach(o=>o.classList.toggle('selected', o===opt));
        current.innerHTML = variantCurrentHtml(findVariant(p, vid));
        closeMenu();
        reqVariant.dispatchEvent(new Event('change'));
      });
    });
    overlay.addEventListener('click', (e)=>{ if(!reqVariantWrap.contains(e.target)) closeMenu(); });
  }
  const stockHint = document.getElementById('reqStockHint');
  const lowHint = document.getElementById('reqLowHint');
  function refreshHint(){
    const v = (reqVariant ? findVariant(p, reqVariant.value) : variants[0]) || variants[0];
    if(!v) return;
    stockHint.textContent = `Currently ${v.qty||0} ${p.unit||'units'} in stock`;
    if(variantIsLow(v)){ lowHint.textContent = 'This color/size is low in stock.'; lowHint.classList.add('low'); }
    else { lowHint.textContent = ''; lowHint.classList.remove('low'); }
  }
  if(reqVariant) reqVariant.addEventListener('change', refreshHint);
  document.getElementById('confirmRequestBtn').addEventListener('click', async (e)=>{
    const amount = Math.max(1, parseInt(qtyInput.value,10)||1);
    const note = document.getElementById('modalNote').value.trim();
    const v = (reqVariant ? findVariant(p, reqVariant.value) : variants[0]) || variants[0];
    const btn = e.currentTarget; btn.disabled = true;
    const req = {
      id: uid('r'), productId: p.id, variantId: v?v.id:undefined,
      variantLabel: v && variants.length>1 ? variantLabel(v) : '',
      productName: p.name, qty: amount, note,
      requestedByName: state.currentUser.name, requestedByUsername: state.currentUser.username,
      status:'pending', timestamp: Date.now(), viewerSeen:true
    };
    state.requests.unshift(req);
    const ok = await saveRequests();
    closeModal();
    toast(ok ? 'Request sent to admins' : "Saved locally, but couldn't sync — tap Retry sync at the top", ok?'success':'error');
  });
}

function renderRequestsModal(){

  return `

    </div>
  </div>`;
}

          <div class="faint" style="font-size:11.5px;margin-top:2px;">${admin?`Requested by ${esc(r.requestedByName)} · `:''}${dt.full}</div>

      <button class="btn btn-outline btn-sm" style="flex:1;" data-dismissreq="${r.id}">Dismiss</button>
    </div>` : ''}

/* =========================================================
   CATEGORIES MODAL (vertical list, name + count)
   ========================================================= */
function openCategoriesModal(){
  state.categorySearch = '';
  state.modal = ()=> renderCategoriesModal();
  render();
  bindCategoriesModal();
}
function renderCategoriesModal(){
  const q = (state.categorySearch||'').trim().toLowerCase();
  const totalCount = state.products.length;
  const lowCount = state.products.filter(productIsLow).length;
  const countFor = c => state.products.filter(p=>p.category===c).length;
  const isAllActive = state.filterCategory==='all' && !state.filterLowStock;
  const isLowActive = state.filterLowStock;
  const entries = [
    { label: 'All', count: totalCount, active: isAllActive, pick: 'all' },
    { label: 'Low stock', count: lowCount, active: isLowActive, pick: 'low' },
    ...categories().map(c=>({ label: c, count: countFor(c), active: !isLowActive && state.filterCategory===c, pick: `cat:${c}` }))
  ];
  const filtered = q ? entries.filter(e=>e.label.toLowerCase().includes(q)) : entries;
  return `
  <div class="overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-head">
        <h3>Categories</h3>
        <button class="modal-close" id="modalCloseBtn">${iconClose()}</button>
      </div>
      <div class="search-bar">
        <input id="categorySearchInput" type="text" placeholder="Search categories…" value="${esc(state.categorySearch||'')}">
      </div>
      <div class="cat-list">
        ${filtered.length ? filtered.map(e=>`
        <div class="cat-list-item ${e.active?'active':''}" data-catpick="${esc(e.pick)}">
          <span>${esc(e.label)}</span><span class="count">${e.count}</span>
        </div>`).join('') : `<div class="empty" style="padding:24px 0;"><div class="t" style="font-size:14px;">No categories found</div></div>`}
      </div>
    </div>
  </div>`;
}
function bindCategoriesModal(){
  const overlay = document.getElementById('modalOverlay');
  overlay.addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  const search = document.getElementById('categorySearchInput');
  if(search) search.addEventListener('input', e=>{
    state.categorySearch = e.target.value;
    render();
    bindCategoriesModal();
    const el = document.getElementById('categorySearchInput');
    if(el){ el.focus(); el.setSelectionRange(state.categorySearch.length, state.categorySearch.length); }
  });
  document.querySelectorAll('[data-catpick]').forEach(item=>{
    item.addEventListener('click', ()=>{
      const v = item.getAttribute('data-catpick');
      if(v==='all'){ state.filterCategory='all'; state.filterLowStock=false; }
      else if(v==='low'){ state.filterLowStock=true; state.filterCategory='all'; }
      else { state.filterCategory = v.replace('cat:',''); state.filterLowStock=false; }
      state.modal = null;
      render();
    });
  });
}

/* =========================================================
   EVENT BINDING
   ========================================================= */
function bindShell(){
  const retryBtn = document.getElementById('retrySyncBtn');
  if(retryBtn) retryBtn.addEventListener('click', async ()=>{
    retryBtn.textContent = 'Retrying…';
    const [stockOk, usersOk, reqOk] = await Promise.all([saveStock(), saveUsers(), saveRequests()]);
    if(stockOk && usersOk && reqOk){ state.syncFailed = false; toast('Synced', 'success'); }
    else toast("Still couldn't sync — check your connection", 'error');
    render();
  });
  const themeBtn = document.getElementById('themeBtn');
  if(themeBtn) themeBtn.addEventListener('click', toggleTheme);
  const notifBtn = document.getElementById('notifBtn');
  if(notifBtn) notifBtn.addEventListener('click', openRequestsModal);
  const accountBtn = document.getElementById('accountBtn');
  if(accountBtn) accountBtn.addEventListener('click', openAccountModal);
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.addEventListener('click', async ()=>{
    stopScanner();
    await unsubscribeFromPush();
    state.currentUser = null;
    await clearSession();
    state.view = 'dashboard';
    render();
  });
  const menuBtn = document.getElementById('menuBtn');
  if(menuBtn) menuBtn.addEventListener('click', openMenuDrawer);
  document.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      stopScanner();
      state.view = btn.getAttribute('data-nav');
      state.searchQuery=''; state.filterCategory='all'; state.filterLowStock=false;
      render();
    });
  });

  if(state.view === 'dashboard'){
    const pendingBanner = document.getElementById('dashPendingReq');
    if(pendingBanner) pendingBanner.addEventListener('click', openRequestsModal);
  }

  if(state.view === 'products'){
    const search = document.getElementById('searchInput');
    if(search) search.addEventListener('input', e=>{ state.searchQuery = e.target.value; render(); document.getElementById('searchInput').focus(); document.getElementById('searchInput').setSelectionRange(state.searchQuery.length, state.searchQuery.length); });
    const catBtn = document.getElementById('openCategoriesBtn');
    if(catBtn) catBtn.addEventListener('click', openCategoriesModal);
    document.querySelectorAll('[data-open]').forEach(t=>{
      t.addEventListener('click', ()=>{ state.selectedProductId = t.getAttribute('data-open'); state.view='detail'; render(); });
    });
    const fab = document.getElementById('fabAdd');
    if(fab) fab.addEventListener('click', ()=>{ state.editingProductId=null; state.view='addProduct'; render(); });
  }

  if(state.view === 'detail'){
    const p = findProduct(state.selectedProductId);
    const editBtn = document.getElementById('editProductBtn');
    if(editBtn) editBtn.addEventListener('click', ()=>{ state.editingProductId = state.selectedProductId; state.view='addProduct'; render(); });
    const delBtn2 = document.getElementById('deleteProductDetailBtn');
    if(delBtn2) delBtn2.addEventListener('click', ()=>{
      if(!p) return;
      openConfirmModal({
        title: 'Delete product?',
        message: `Delete "${p.name}"? This cannot be undone.`,
        confirmLabel: 'Delete',
        danger: true,
        onConfirm: async ()=>{
          state.products = state.products.filter(x=>x.id!==p.id);
          const ok = await saveStock();
          state.view='products'; state.modal=null;
          render();
          toast(ok ? 'Product deleted' : "Deleted locally, but couldn't sync — tap Retry sync at the top", ok?'success':'error');
        }
      });
    });
    document.querySelectorAll('[data-stockaction]').forEach(b=>{
      b.addEventListener('click', ()=> openStockModal(b.getAttribute('data-stockaction'), b.getAttribute('data-variantid')));
    });
    const reqStockBtn = document.querySelector('[data-requeststock]');
    if(reqStockBtn) reqStockBtn.addEventListener('click', ()=>{ if(p) openRequestModal(p); });
  }

  if(state.view === 'addProduct') bindProductForm();
  if(state.view === 'scan') bindScanView();
  if(state.view === 'history'){
    const search = document.getElementById('searchInput');
    if(search) search.addEventListener('input', e=>{ state.searchQuery = e.target.value; render(); });
    const clearBtn = document.getElementById('clearHistoryBtn');
    if(clearBtn) clearBtn.addEventListener('click', ()=>{
      openConfirmModal({
        title: 'Clear all history?',
        message: `Delete all ${state.history.length} logged movements? This cannot be undone.`,
        confirmLabel: 'Clear all',
        danger: true,
        onConfirm: async ()=>{
          state.history = [];
          const ok = await saveStock();
          state.modal = null;
          render();
          toast(ok ? 'Stock history cleared' : "Cleared locally, but couldn't sync — tap Retry sync at the top", ok?'success':'error');
        }
      });
    });
  }
  if(state.view === 'team') bindTeamView();
  if(state.view === 'parcels') bindParcelsView();
}

function bindProductForm(){
  const editing = state.editingProductId ? findProduct(state.editingProductId) : null;
  let pendingImage = editing ? editing.image : '';

  const wrap = document.getElementById('imgUploadWrap');

  async function handleImageFile(file){
    if(!file) return;
    if(!file.type || !file.type.startsWith('image/')){ toast('Please drop an image file', 'error'); return; }
    try{
      pendingImage = await resizeImage(file, 320, 0.65);
      wrap.classList.add('has-img');
      wrap.innerHTML = `<img id="imgPreview" src="${pendingImage}"><input type="file" accept="image/*" id="imageInput">`;
      document.getElementById('imageInput').addEventListener('change', e=>{
        handleImageFile(e.target.files[0]);
      });
    }catch(err){ toast('Could not process image', 'error'); }
  }

  document.getElementById('imageInput').addEventListener('change', e=>{
    handleImageFile(e.target.files[0]);
  });

  ['dragenter','dragover'].forEach(evt=>{
    wrap.addEventListener(evt, e=>{
      e.preventDefault(); e.stopPropagation();
      wrap.classList.add('drag-over');
    });
  });
  ['dragleave','dragend'].forEach(evt=>{
    wrap.addEventListener(evt, e=>{
      e.preventDefault(); e.stopPropagation();
      wrap.classList.remove('drag-over');
    });
  });
  wrap.addEventListener('drop', e=>{
    e.preventDefault(); e.stopPropagation();
    wrap.classList.remove('drag-over');
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(file) handleImageFile(file);
  });

  const variantRowsWrap = document.getElementById('variantRows');
  function bindVariantRow(row){
    const vColor = row.querySelector('.vColor'), vColorOther = row.querySelector('.vColorOther');
    const palette = row.querySelector('.color-palette'), vColorHex = row.querySelector('.vColorHex');
    const hexRow = row.querySelector('.hex-row');
    const vColorPicker = row.querySelector('.vColorPicker'), vColorHexText = row.querySelector('.vColorHexText');
    const normalizeHex = (s)=>{
      s = (s||'').trim();
      if(!s) return '';
      if(s[0]!=='#') s = '#'+s;
      return /^#[0-9A-Fa-f]{6}$/.test(s) ? s.toUpperCase() : null;
    };
    vColor.addEventListener('change', ()=>{
      const isOther = vColor.value==='__other__';
      vColorOther.style.display = isOther ? '' : 'none';
      palette.style.display = isOther ? '' : 'none';
      hexRow.style.display = isOther ? '' : 'none';
      if(isOther){
        vColorOther.focus();
      } else {
        const key = vColor.value.trim().toLowerCase();
        vColorHex.value = COLOR_HEX[key] || '';
        palette.querySelectorAll('.palette-swatch').forEach(b=>b.classList.remove('active'));
      }
    });
    palette.querySelectorAll('.palette-swatch').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        palette.querySelectorAll('.palette-swatch').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        const hex = btn.getAttribute('data-hex');
        vColorHex.value = hex;
        vColorPicker.value = hex;
        vColorHexText.value = hex;
        vColorOther.value = btn.getAttribute('data-name');
      });
    });
    vColorPicker.addEventListener('input', ()=>{
      const hex = vColorPicker.value.toUpperCase();
      vColorHex.value = hex;
      vColorHexText.value = hex;
      palette.querySelectorAll('.palette-swatch').forEach(b=>b.classList.remove('active'));
      if(!vColorOther.value.trim()) vColorOther.value = hex;
    });
    vColorHexText.addEventListener('input', ()=>{
      const valid = normalizeHex(vColorHexText.value);
      if(valid){
        vColorHex.value = valid;
        vColorPicker.value = valid;
        palette.querySelectorAll('.palette-swatch').forEach(b=>b.classList.remove('active'));
        if(!vColorOther.value.trim()) vColorOther.value = valid;
      }
    });
    const vSize = row.querySelector('.vSize'), vSizeOther = row.querySelector('.vSizeOther');
    vSize.addEventListener('change', ()=>{ vSizeOther.style.display = vSize.value==='__other__' ? '' : 'none'; if(vSize.value==='__other__') vSizeOther.focus(); });
    row.querySelector('.removeVariantBtn').addEventListener('click', ()=>{
      if(variantRowsWrap.querySelectorAll('[data-vrow]').length <= 1){
        toast('A product needs at least one color/size row', 'error');
        return;
      }
      row.remove();
    });
  }
  variantRowsWrap.querySelectorAll('[data-vrow]').forEach(bindVariantRow);
  document.getElementById('addVariantBtn').addEventListener('click', ()=>{
    const tmp = document.createElement('div');
    tmp.innerHTML = variantRowHtml({ id: uid('v'), color:'', size:'', qty:0, reorderLevel:5 }, false).trim();
    const row = tmp.firstElementChild;
    variantRowsWrap.appendChild(row);
    bindVariantRow(row);
  });

  document.getElementById('regenBarcode').addEventListener('click', ()=>{
    document.getElementById('fBarcode').value = genBarcode();
  });
  document.getElementById('cancelProductBtn').addEventListener('click', ()=>{
    state.view = editing ? 'detail' : 'products';
    render();
  });
  document.getElementById('saveProductBtn').addEventListener('click', async (e)=>{
    const name = document.getElementById('fName').value.trim();
    if(!name){ toast('Product name is required', 'error'); return; }
    const sku = document.getElementById('fSku').value.trim();
    const category = document.getElementById('fCategory').value.trim();
    const unit = document.getElementById('fUnit').value.trim() || 'units';
    const barcode = document.getElementById('fBarcode').value.trim() || genBarcode();

    const rows = Array.from(variantRowsWrap.querySelectorAll('[data-vrow]'));
    if(!rows.length){ toast('Add at least one color/size row', 'error'); return; }
    const newVariants = [];
    for(const row of rows){
      const colorSel = row.querySelector('.vColor').value;
      const color = colorSel==='__other__' ? row.querySelector('.vColorOther').value.trim() : colorSel;
      let colorHex = row.querySelector('.vColorHex').value.trim();
      if(!colorHex && color){
        const key = color.trim().toLowerCase();
        if(COLOR_HEX[key]) colorHex = COLOR_HEX[key];
      }
      const sizeSel = row.querySelector('.vSize').value;
      const size = sizeSel==='__other__' ? row.querySelector('.vSizeOther').value.trim() : sizeSel;
      const reorderLevel = Math.max(0, parseInt(row.querySelector('.vReorder').value,10) || 0);
      const isExisting = row.getAttribute('data-existing')==='1';
      const vid = row.getAttribute('data-vid');
      if(isExisting){
        const orig = findVariant(editing, vid);
        newVariants.push({ id: vid, color, size, colorHex, qty: orig ? orig.qty : 0, reorderLevel });
      } else {
        const qty = Math.max(0, parseInt(row.querySelector('.vQty').value,10) || 0);
        newVariants.push({ id: vid, color, size, colorHex, qty, reorderLevel, _startingQty: qty });
      }
    }

    const btn = e.currentTarget;
    btn.disabled = true;
    const originalLabel = btn.textContent;
    btn.textContent = 'Saving…';

    if(editing){
      editing.name=name; editing.sku=sku; editing.category=category; editing.unit=unit;
      editing.barcode=barcode; editing.image=pendingImage; editing.updatedAt=Date.now();
      editing.variants = newVariants.map(v=>({ id:v.id, color:v.color, size:v.size, colorHex:v.colorHex, qty:v.qty, reorderLevel:v.reorderLevel }));
      delete editing.color; delete editing.size; delete editing.qty; delete editing.reorderLevel;
      newVariants.filter(v=>v._startingQty>0).forEach(v=>{
        state.history.push({ id: uid('h'), productId:editing.id, variantId:v.id, variantLabel: variantLabel(v), productName:name, sku, productImage: pendingImage||'', type:'manufactured', qty:v._startingQty, resultingQty:v._startingQty, note:'Initial stock (new variant)', user: state.currentUser.name, username: state.currentUser.username, timestamp: Date.now() });
      });
      const ok = await saveStock();
      toast(ok ? 'Product updated' : "Updated locally, but couldn't sync — tap Retry sync at the top", ok?'success':'error');
      state.view='detail'; state.selectedProductId=editing.id; render();
    } else {
      const variants = newVariants.map(v=>({ id:v.id, color:v.color, size:v.size, colorHex:v.colorHex, qty:v.qty, reorderLevel:v.reorderLevel }));
      const p = { id: uid('p'), name, sku, category, unit, barcode, image: pendingImage, variants, createdAt: Date.now(), updatedAt: Date.now() };
      state.products.push(p);
      newVariants.filter(v=>v._startingQty>0).forEach(v=>{
        state.history.push({ id: uid('h'), productId:p.id, variantId:v.id, variantLabel: variantLabel(v), productName:name, sku, productImage: pendingImage||'', type:'manufactured', qty:v._startingQty, resultingQty:v._startingQty, note:'Initial stock', user: state.currentUser.name, username: state.currentUser.username, timestamp: Date.now() });
      });
      const ok = await saveStock();
      toast(ok ? 'Product created' : "Created locally, but couldn't sync — tap Retry sync at the top", ok?'success':'error');
      state.selectedProductId = p.id; state.view='detail'; render();
    }
    btn.disabled = false;
    btn.textContent = originalLabel;
  });
  const delBtn = document.getElementById('deleteProductBtn');
  if(delBtn) delBtn.addEventListener('click', ()=>{
    openConfirmModal({
      title: 'Delete product?',
      message: `Delete "${editing.name}"? This cannot be undone.`,
      confirmLabel: 'Delete',
      danger: true,
      onConfirm: async ()=>{
        state.products = state.products.filter(p=>p.id!==editing.id);
        const ok = await saveStock();
        state.view='products'; state.modal=null;
        render();
        toast(ok ? 'Product deleted' : "Deleted locally, but couldn't sync — tap Retry sync at the top", ok?'success':'error');
      }
    });
  });
}

function bindScanView(){
  document.getElementById('manualLookupBtn').addEventListener('click', ()=>{
    const v = document.getElementById('manualCode').value.trim();
    if(v) lookupCode(v);
  });
  document.getElementById('manualCode').addEventListener('keydown', e=>{
    if(e.key==='Enter'){ const v=e.target.value.trim(); if(v) lookupCode(v); }
  });
}

function bindTeamView(){
  document.querySelectorAll('[data-passfor]').forEach(el=>{
    let revealed = false;
    el.addEventListener('click', ()=>{
      revealed = !revealed;
      const pass = el.getAttribute('data-pass') || '(none set)';
      el.textContent = revealed ? `Password: ${pass} (tap to hide)` : 'Password: •••••• (tap to reveal)';
    });
  });
  document.querySelectorAll('[data-edituser]').forEach(b=>{
    b.addEventListener('click', ()=> openEditUserModal(b.getAttribute('data-edituser')));
  });
  document.querySelectorAll('[data-deluser]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const id = b.getAttribute('data-deluser');
      const target = state.users.find(u=>u.id===id);
      const admins = state.users.filter(u=>u.role==='admin');
      if(target.role==='admin' && admins.length<=1){ toast("Can't remove the last admin", 'error'); return; }
      openConfirmModal({
        title: 'Remove account?',
        message: `Remove ${target.name}'s account? They won't be able to sign in anymore.`,
        confirmLabel: 'Remove',
        danger: true,
        onConfirm: async ()=>{
          state.users = state.users.filter(u=>u.id!==id);
          const ok = await saveUsers();
          state.view='team'; state.modal=null;
          render();
          toast(ok ? 'Account removed' : "Removed locally, but couldn't sync — tap Retry sync at the top", ok?'success':'error');
        }
      });
    });
  });
  document.getElementById('addUserBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('tName').value.trim();
    const username = document.getElementById('tUser').value.trim();
    const password = document.getElementById('tPass').value;
    const role = document.getElementById('tRole').value;
    if(!name || !username || !password){ toast('Fill in all fields', 'error'); return; }
    if(state.users.some(u=>u.username.toLowerCase()===username.toLowerCase())){ toast('Username already taken', 'error'); return; }
    state.users.push({ id: uid('u'), name, username, password, role, createdAt: Date.now() });
    await saveUsers();
    toast('Account created', 'success');
    render();
  });
}

/* =========================================================
   BOOT
   ========================================================= */
// Delegated, one-time listener for the dashboard stat cards and the
// low-stock banner — tapping any of them jumps to Products with the
// right filter applied.
document.addEventListener('click', (e)=>{
  if(e.target.closest('#dashLowStockBanner') || e.target.closest('#statLowStock')){
    state.view = 'products'; state.filterCategory = 'all'; state.filterLowStock = true; state.searchQuery='';
    render();
    return;
  }
  if(e.target.closest('#statProducts') || e.target.closest('#statUnits')){
    state.view = 'products'; state.filterCategory = 'all'; state.filterLowStock = false; state.searchQuery='';
    render();
    return;
  }
});

// Delegated, one-time listener for activity-log delete buttons.
// Attached to document once (not re-bound on every render), so it can
// never get skipped or duplicated as the DOM is replaced on each render().
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-delete-history]');
  if(!btn) return;
  e.stopPropagation();
  const id = btn.getAttribute('data-delete-history');
  const h = state.history.find(x=>x.id===id);
  if(!h) return;
  openConfirmModal({
    title: 'Delete activity?',
    message: `Delete "${h.qty} × ${h.productName}" from the activity log? This cannot be undone.`,
    confirmLabel: 'Delete',
    danger: true,
    onConfirm: async ()=>{
      state.history = state.history.filter(x=>x.id!==h.id);
      const ok = await saveStock();
      state.modal=null;
      render();
      toast(ok ? 'Activity deleted' : "Deleted locally, but couldn't sync — tap Retry sync at the top", ok?'success':'error');
    }
  });
});

async function boot(){
  document.getElementById('app').innerHTML = `<div style="min-height:100vh;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:var(--text-dim);font-family:var(--display);letter-spacing:.05em;"><img src="${LOGO_ICON}" alt="" style="width:56px;height:56px;border-radius:12px;">LOADING…</div>`;
  registerServiceWorker(); // fire-and-forget — has it ready before login needs it
  await loadTheme();
  await initData();
  await bootSession();
  render();
  if(state.currentUser) startPolling();
  startGreetingClock();
}
boot();
