<style>
:root{
  --bg:#0B0F17; --panel:#121826; --panel2:#19212F; --panel3:#212B3D;
  --border:#2C3548; --border-soft:#1B2333;
  --text:#F1F5F9; --text-dim:#94A3B8; --text-faint:#64748B;
  --yellow:#058635; --yellow-dark:#16A34A; --yellow-ink:#0B0F17;
  --teal:#22D3EE; --red:#FB7185; --red-dim:#4C1D2A;
  --mono:'JetBrains Mono',monospace; --display:'Oswald',sans-serif; --body:'Inter',sans-serif;
  --radius:10px;
  --topbar-bg:rgba(1, 37, 4, 0.92); --nav-bg:rgba(244, 245, 248, 0.96);
}
body.theme-light{ --topbar-bg:rgba(1, 37, 4, 0.92); --nav-bg:rgba(244, 245, 248, 0.96); }
body.theme-light{
  --bg:#F8FAFC; --panel:#FFFFFF; --panel2:#F1F5F9; --panel3:#E2E8F0;
  --border:#E2E8F0; --border-soft:#EEF2F7;
  --text:#0F172A; --text-dim:#475569; --text-faint:#94A3B8;
  --yellow:#16A34A; --yellow-dark:#15803D; --yellow-ink:#FFFFFF;
  --teal:#0891B2; --red:#DC2626; --red-dim:#FEE2E2;
}
body.theme-light .barcode-wrap{border:1px solid var(--border);}
body.theme-light .login-stripes{opacity:.8;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--body);
  min-height:100vh; -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;background:var(--bg);}

/* ---------- desktop / wide-screen layout ---------- */
@media (min-width:860px){
  body{background:radial-gradient(ellipse 1200px 800px at 50% -10%, var(--panel2) 0%, var(--bg) 60%);}
  #app{max-width:820px;box-shadow:0 0 0 1px var(--border-soft), 0 40px 90px -30px rgba(0,0,0,.55);}
  .topbar{max-width:820px;padding:16px 28px;}
  .bottomnav{max-width:820px;}
  .view{padding-left:28px;padding-right:28px;}
  .stat-row{grid-template-columns:repeat(3,1fr);}
  .modal{max-width:520px;border-radius:16px;margin:auto;}
}
@media (min-width:1280px){
  #app{max-width:980px;}
  .topbar{max-width:980px;}
  .bottomnav{max-width:980px;}
}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* ---------- typography helpers ---------- */
.h-display{font-family:var(--display);font-weight:600;letter-spacing:.02em;text-transform:uppercase;}
.h-mono{font-family:var(--mono);}
.dim{color:var(--text-dim);}
.faint{color:var(--text-faint);}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:32px 24px;position:relative;overflow:hidden;
background-image:url('bg.jpeg');background-size:cover;background-position:center;background-repeat:no-repeat;}
.login-stripes{position:absolute;top:0;left:0;right:0;height:10px;
  background:repeating-linear-gradient(45deg,var(--yellow) 0 18px,var(--yellow-ink) 18px 36px);opacity:.9;}
.login-brand{margin-bottom:36px;width:100%;max-width:340px;}
.login-brand .mark-logo{display:block;width:auto;height:64px;margin:0 auto 16px;border-radius:8px;}
.login-brand h1{font-size:30px;margin:0 0 4px;}
.login-brand p{margin:0;color:var(--text-dim);font-size:14px;}
.login-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:340px;text-align:left;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
.field input,.field select,.field textarea{
  width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
  padding:12px 14px;border-radius:8px;font-size:15px;outline:none;transition:border-color .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--yellow);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 18px;border-radius:8px;border:none;font-weight:600;font-size:14px;cursor:pointer;
  transition:transform .1s, opacity .15s; width:100%; text-transform:uppercase; letter-spacing:.04em; font-family:var(--display);
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--yellow);color:var(--yellow-ink);}
.btn-primary:hover{background:#ffc255;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-outline:hover{border-color:var(--text-dim);}
.btn-danger{background:var(--red);color:#fff;}
.btn-teal{background:var(--teal);color:#0b2318;}
.btn-sm{padding:9px 12px;font-size:12px;width:auto;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.login-err{background:var(--red-dim);border:1px solid var(--red);color:#ffb4b6;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;}
.login-hint{margin-top:18px;font-size:12px;color:var(--text-faint);line-height:1.6;text-align:center;}

/* ---------- shell ---------- */
.topbar{
  position:sticky;top:0;z-index:20;background:var(--topbar-bg);backdrop-filter:blur(8px);
  padding:14px 16px;display:flex;align-items:flex-start;justify-content:space-between;
}
.topbar-inner{position:relative;display:flex;align-items:center;justify-content:space-between;width:100%;}
.topbar-brand{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;pointer-events:none;}
.topbar-brand img{height:36px;width:auto;display:block;}
.topbar-logo{width:30px;height:30px;border-radius:7px;margin-right:10px;flex-shrink:0;object-fit:cover;}
.topbar .who{display:flex;flex-direction:column;line-height:1.25;flex:1;min-width:0;}
.topbar .who .name{font-weight:700;font-size:15px;color:#ffffff}
.topbar .who .role{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#ffffff;opacity:.75;}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--teal);display:inline-block;margin-right:6px;
  box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:pulse 2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.5);}70%{box-shadow:0 0 0 7px rgba(61,220,151,0);}100%{box-shadow:0 0 0 0 rgba(61,220,151,0);}}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.icon-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;width:36px;height:36px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex-shrink:0;}
.icon-btn:active{transform:scale(.95);}
.view .icon-btn, .modal .icon-btn, .menu-drawer .icon-btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);}
.notif-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--red);border:1.5px solid var(--topbar-bg);}

/* menu drawer (hamburger) */
.menu-drawer{background:var(--panel);border:1px solid var(--border);border-top:none;border-radius:0 0 16px 16px;width:100%;max-width:340px;
  margin:0 auto 0 0;padding:18px;position:absolute;top:0;left:0;box-shadow:0 20px 50px -20px rgba(0,0,0,.6);}
.menu-drawer .who-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border-soft);}
.menu-drawer .who-row .avatar{width:42px;height:42px;color:var(--text);}
.menu-drawer .who-row .name{font-weight:700;font-size:15px;color:var(--text);}
.menu-drawer .who-row .role{font-size:12px;color:var(--text-dim);}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;color:var(--text);
  padding:12px 6px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;text-align:left;}
.menu-item:active{background:var(--panel2);}
.menu-item.danger{color:var(--red);}
.menu-item.danger .icon-btn{color:var(--red);}
.menu-item .icon-btn{pointer-events:none;}

.view{flex:1;padding:16px 16px 100px;position:relative;}
.dash-hero{position:relative;height:190px;overflow:hidden;
  background-image:url('hero.jpg');background-size:cover;background-position:center;}
.dash-hero::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(11,15,23,0) 30%, rgba(11,15,23,.88) 100%);}
.dash-hero-text{position:absolute;left:18px;right:18px;bottom:14px;color:#fff;z-index:1;}
.dash-hero-text .greet{font-size:13px;opacity:.85;}
.dash-hero-text .name{font-size:24px;font-weight:800;margin:2px 0 4px;font-family:var(--display);letter-spacing:.02em;}
.dash-hero-text .sub{font-size:13px;opacity:.85;}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.page-head h2{font-size:22px;margin:0;}
.page-head .sub{color:var(--text-dim);font-size:13px;margin-top:2px;}

.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  max-width:520px;margin:0 auto;background:var(--nav-bg);backdrop-filter:blur(10px);
  border-top:1px solid var(--border-soft);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:8px;
  color:var(--text-faint);cursor:pointer;background:none;border:none;}
.nav-item.active{color:#0e4e26;}
.nav-item svg{width:20px;height:20px;}
.nav-item span{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}

/* ---------- cards / stats ---------- */
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.stat-row.three{grid-template-columns:1fr 1fr 1fr;}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.stat-card .num{font-family:var(--display);font-size:26px;font-weight:600;}
.stat-card .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);margin-top:2px;}
.stat-card.alert{border-color:var(--red);background:linear-gradient(180deg,var(--red-dim),var(--panel));}
.stat-card.alert .num{color:#ff8f92;}
.stat-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:10px;flex:none;}
.stat-icon svg{width:16px;height:16px;}
.stat-icon.blue{background:#DBEAFE;color:#2563EB;}
.stat-icon.green{background:#DCFCE7;color:#16A34A;}
.stat-icon.red{background:var(--red-dim);color:var(--red);}
body.theme-light .stat-icon.red{background:#FEE2E2;color:#DC2626;}
.stat-card .lbl-row{display:flex;align-items:center;justify-content:space-between;}

.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);font-weight:700;margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;}

.alert-banner{background:var(--red-dim);border:1px solid var(--red);border-radius:var(--radius);padding:14px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-start;overflow:hidden;transition:filter .15s;}
.alert-banner[style*="cursor:pointer"]:hover{filter:brightness(1.12);}
.alert-banner-icon{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.alert-banner-icon svg{width:18px;height:18px;color:#ff8f92;display:block;}
body.theme-light .alert-banner-icon svg{color:#DC2626;}
.alert-banner .t{font-weight:700;font-size:14px;color:#ffcfd0;}
.alert-banner .d{font-size:12.5px;color:#f0b3b4;margin-top:3px;line-height:1.5;word-break:break-word;}
body.theme-light .alert-banner .t{color:#9F1239;}
body.theme-light .alert-banner .d{color:#B91C3C;}

.feed-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft);align-items:flex-start;}
.feed-item:last-child{border-bottom:none;}
.feed-dot{width:30px;height:30px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;}
.feed-dot.in{background:rgba(61,220,151,.15);color:var(--teal);}
.feed-dot.out{background:rgba(245,197,24,.15);color:var(--yellow);}
.feed-thumb{width:30px;height:30px;border-radius:7px;flex-shrink:0;overflow:hidden;background:var(--panel3);}
.feed-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.feed-dir{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:4px;margin-right:5px;vertical-align:-3px;}
.feed-dir.in{background:rgba(61,220,151,.15);color:var(--teal);}
.feed-dir.out{background:rgba(245,197,24,.15);color:var(--yellow);}
.feed-body{flex:1;min-width:0;}
.feed-body .t1{font-size:13.5px;font-weight:600;}
.feed-body .t2{font-size:12px;color:var(--text-dim);margin-top:1px;}
.feed-body .t3{font-size:11px;color:var(--text-faint);margin-top:2px;font-family:var(--mono);}
.feed-delete{flex-shrink:0;width:30px;height:30px;color:var(--text-faint);}
.feed-delete:hover{color:var(--red);}

/* ---------- ticket-style product card ---------- */
.ticket{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;cursor:pointer;}
.ticket:active{transform:scale(.995);}
.ticket-top{display:flex;gap:12px;padding:12px;}
.ticket-img{width:60px;height:60px;border-radius:8px;background:var(--panel2);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--text-faint);border:1px solid var(--border-soft);}
.ticket-img img{width:100%;height:100%;object-fit:cover;}
.ticket-info{flex:1;min-width:0;}
.ticket-info .name{font-weight:700;font-size:15px;line-height:1.25;}
.ticket-info .cat{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
.ticket-info .sku{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-top:4px;}
.ticket-qty{text-align:right;flex-shrink:0;}
.ticket-qty .n{font-family:var(--display);font-size:22px;font-weight:600;}
.ticket-qty .u{font-size:10px;color:var(--text-dim);text-transform:uppercase;}
.ticket.low .ticket-qty .n{color:#ff8f92;}
.ticket-divider{height:0;border-top:2px dashed var(--border);position:relative;margin:0;}
.ticket-divider::before,.ticket-divider::after{content:'';position:absolute;top:-8px;width:16px;height:16px;border-radius:50%;background:var(--bg);}
.ticket-divider::before{left:-8px;}
.ticket-divider::after{right:-8px;}
.ticket-bottom{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--panel2);}
.ticket-bottom .code{font-family:var(--mono);font-size:11px;color:var(--text-dim);letter-spacing:.03em;}
.low-tag{background:var(--red);color:#fff;font-size:9.5px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:20px;letter-spacing:.04em;}
.out-tag{background:#4B5563;color:#fff;font-size:9.5px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:20px;letter-spacing:.04em;}
.in-tag{background:var(--yellow);color:var(--yellow-ink);font-size:9.5px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:20px;letter-spacing:.04em;}
.hazard-edge{height:5px;background:repeating-linear-gradient(45deg,var(--red) 0 8px,var(--yellow-ink) 8px 16px);}

/* ---------- search / filters ---------- */
.search-bar{display:flex;gap:8px;margin-bottom:12px;}
.search-bar input{flex:1;}
.filter-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;}
.cat-select-bar{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;
  background:var(--panel);border:1px solid var(--border);border-radius:10px;color:var(--text);
  font-size:14px;font-weight:600;margin-bottom:16px;cursor:pointer;font-family:var(--body);}
.cat-select-bar svg{width:16px;height:16px;color:var(--text-dim);flex-shrink:0;}
.cat-list{display:flex;flex-direction:column;}
.cat-list-item{display:flex;align-items:center;justify-content:space-between;padding:14px 12px;
  border-bottom:1px solid var(--border-soft);cursor:pointer;font-size:14.5px;color:var(--text);
  border-left:3px solid transparent;}
.cat-list-item:last-child{border-bottom:none;}
.cat-list-item .count{color:var(--text-dim);font-family:var(--mono);font-size:13px;}
.cat-list-item.active{border-left-color:var(--yellow);font-weight:700;background:var(--panel2);border-radius:0 8px 8px 0;}
.cat-list-item.active .count{color:var(--yellow);font-weight:700;}
.chip{flex-shrink:0;padding:7px 13px;border-radius:20px;border:1px solid var(--border);background:var(--panel);
  font-size:12.5px;color:var(--text-dim);cursor:pointer;white-space:nowrap;font-weight:600;}
.chip.active{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow);}

/* ---------- empty state ---------- */
.empty{text-align:center;padding:46px 20px;color:var(--text-faint);}
.empty-icon{width:60px;height:60px;border-radius:50%;background:var(--panel2);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--text-dim);}
.empty-icon svg{width:26px;height:26px;display:block;}
.empty .t{font-weight:700;color:var(--text-dim);margin-bottom:4px;font-size:14.5px;}
.empty .d{font-size:13px;max-width:280px;margin:0 auto;line-height:1.55;}

/* ---------- FAB ---------- */
.fab{position:fixed;bottom:88px;right:calc(50% - 260px + 18px);z-index:19;width:54px;height:54px;border-radius:50%;
  background:var(--yellow);color:var(--yellow-ink);border:none;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.4);cursor:pointer;}
@media (max-width:560px){.fab{right:18px;}}
.fab:active{transform:scale(.94);}

/* ---------- detail / forms ---------- */
.detail-hero{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px;}
.detail-img{width:84px;height:84px;border-radius:12px;background:var(--panel2);border:1px solid var(--border);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--text-faint);flex-shrink:0;}
.detail-img img{width:100%;height:100%;object-fit:cover;}
.detail-hero h2{margin:0 0 4px;font-size:20px;}
.badge{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;padding:3px 9px;border-radius:20px;letter-spacing:.04em;margin-right:6px;}
.badge.cat{background:var(--panel2);color:var(--text-dim);border:1px solid var(--border);}
.badge.low{background:var(--red);color:#fff;}
.badge.out{background:#4B5563;color:#fff;}
.badge.ok{background:rgba(61,220,151,.15);color:var(--teal);}

.panel-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.kv-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px;}
.kv-row:last-child{border-bottom:none;}
.kv-row .k{color:var(--text-dim);}
.kv-row .v{font-weight:600;font-family:var(--mono);}
.variant-manage-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border-soft);}
.variant-manage-row:last-child{border-bottom:none;}
.variant-manage-row.low .vm-label{color:var(--red);}
.vm-info{flex:1;min-width:0;}
.vm-label{font-weight:700;font-size:13.5px;}
.color-swatch{display:inline-block;width:13px;height:13px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;vertical-align:middle;margin-right:2px;box-shadow:0 0 0 1px rgba(0,0,0,.05) inset;}
.color-swatch-unknown{background:var(--panel3);border-style:dashed;}

.variant-select{position:relative;}
.variant-select-trigger{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--panel2);border:1px solid var(--border);color:var(--text);
  padding:11px 14px;border-radius:8px;font-size:15px;cursor:pointer;transition:border-color .15s;
  font-family:inherit;text-align:left;
}
.variant-select-trigger:hover{border-color:var(--text-dim);}
.variant-select.open .variant-select-trigger{border-color:var(--yellow);}
.variant-select-trigger .vs-current{display:flex;align-items:center;gap:9px;min-width:0;flex:1;}
.variant-select-trigger .vs-current .color-swatch{width:14px;height:14px;margin-right:0;}
.variant-select-trigger .vs-current-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
.variant-select-trigger .vs-current-stock{color:var(--text-dim);font-size:12.5px;flex-shrink:0;white-space:nowrap;}
.variant-select-trigger .vs-chevron{width:16px;height:16px;color:var(--text-dim);flex-shrink:0;transition:transform .15s;}
.variant-select.open .vs-chevron{transform:rotate(180deg);}
.variant-select-menu{
  position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;
  background:var(--panel2);border:1px solid var(--border);border-radius:10px;
  max-height:248px;overflow-y:auto;box-shadow:0 12px 30px -8px rgba(0,0,0,.45);
  padding:5px;
}
.variant-select-option{
  display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:7px;cursor:pointer;
}
.variant-select-option .color-swatch{width:14px;height:14px;margin-right:0;}
.variant-select-option:hover{background:var(--panel3);}
.variant-select-option.selected{background:var(--yellow);color:var(--yellow-ink);}
.variant-select-option.selected .vso-stock{color:var(--yellow-ink);opacity:.75;}
.variant-select-option .vso-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px;font-weight:600;}
.variant-select-option .vso-stock{font-size:12.5px;color:var(--text-dim);flex-shrink:0;white-space:nowrap;}
.variant-select-option .vso-stock.low{color:#F59E0B;}
.variant-select-option.selected .vso-stock.low{color:#7A3E00;}
.variant-select-option .vso-stock.out{color:var(--red);}
.variant-select-option.selected .vso-stock.out{color:#7A1220;}
.color-palette{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;}
.hex-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
.hex-row .vColorHexText{flex:1;font-family:var(--mono);text-transform:uppercase;}
.palette-swatch{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);cursor:pointer;padding:0;box-shadow:0 0 0 1px rgba(0,0,0,.05) inset;flex-shrink:0;}
.palette-swatch.active{border-color:var(--yellow);box-shadow:0 0 0 2px var(--yellow);}
.palette-custom{width:36px;height:36px;border-radius:50%;overflow:hidden;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex-shrink:0;background:repeating-conic-gradient(var(--panel2) 0% 25%, var(--panel3) 0% 50%) 50% / 8px 8px;}
.palette-custom input[type=color]{position:absolute;inset:-4px;width:44px;height:44px;border:none;padding:0;cursor:pointer;background:none;}
.vm-sub{font-size:11px;margin-top:2px;}
.vm-qty{font-family:var(--display);font-weight:600;font-size:18px;flex-shrink:0;text-align:right;}
.vm-unit{display:block;font-family:var(--body);font-weight:500;font-size:10px;color:var(--text-dim);text-transform:uppercase;}
.vm-actions{display:flex;gap:6px;flex-shrink:0;}
.vm-actions .icon-btn{width:32px;height:32px;font-size:18px;font-weight:700;}
.variant-row{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;}
.variant-row .removeVariantBtn{margin-top:6px;}
.variant-low-hint{font-size:11.5px;margin-top:-4px;margin-bottom:10px;}
.variant-low-hint.low{color:var(--red);}

.qty-big{text-align:center;padding:22px 0;}
.qty-big .n{font-family:var(--display);font-size:52px;font-weight:600;line-height:1;}
.qty-big .l{color:var(--text-dim);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-top:6px;}

.action-row{display:flex;gap:10px;margin-bottom:8px;}
.action-row .btn{flex:1;}

.barcode-wrap{background:#fff;border-radius:8px;padding:14px 8px;display:flex;justify-content:center;align-items:center;overflow:hidden;}
.barcode-wrap svg{max-width:100%;}
.barcode-fallback{font-family:var(--mono);color:#111;font-size:15px;letter-spacing:.1em;padding:20px;}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:520px;
  max-height:88vh;overflow-y:auto;padding:20px;animation:slideup .18s ease-out;}
@keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-head h3{margin:0;font-size:18px;}
.modal-close{background:var(--panel2);border:1px solid var(--border);width:32px;height:32px;border-radius:8px;color:var(--text-dim);cursor:pointer;}

.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0 18px;}
.stepper button{width:46px;height:46px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:20px;cursor:pointer;}
.stepper input{width:90px;text-align:center;font-family:var(--display);font-size:26px;background:transparent;border:none;color:var(--text);}
.stepper input:focus{outline:none;}

/* ---------- scanner ---------- */
#reader{width:100%;border-radius:12px;overflow:hidden;background:#000;}
.scan-frame{position:relative;border:2px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px;min-height:260px;display:flex;align-items:center;justify-content:center;background:var(--panel2);}
.scan-placeholder{text-align:center;color:var(--text-faint);padding:30px;font-size:13px;}
.manual-entry{display:flex;gap:8px;}
.manual-entry input{flex:1;}

/* ---------- toast ---------- */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--panel3);border:1px solid var(--border);
  color:var(--text);padding:11px 18px;border-radius:30px;font-size:13px;font-weight:600;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.4);
  display:flex;align-items:center;gap:8px;max-width:88%;}
.toast.success{border-color:var(--teal);}
.toast.error{border-color:var(--red);}

/* ---------- team list ---------- */
.user-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-soft);}
.user-row:last-child{border-bottom:none;}
.avatar{width:38px;height:38px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--display);flex-shrink:0;}
.user-row .info{flex:1;min-width:0;}
.user-row .info .n{font-weight:700;font-size:14px;}
.user-row .info .u{font-size:11.5px;color:var(--text-faint);font-family:var(--mono);}
.role-pill{font-size:10px;font-weight:700;text-transform:uppercase;padding:3px 8px;border-radius:20px;letter-spacing:.03em;}
.role-pill.admin{background:#ffffff;color:#ffffff;}
.role-pill.viewer{background:var(--panel2);color:var(--text-dim);border:1px solid var(--border);}

.status-pill{font-size:10px;font-weight:700;text-transform:uppercase;padding:3px 9px;border-radius:20px;letter-spacing:.03em;white-space:nowrap;}
.status-pill.pending{background:var(--panel2);color:var(--text-dim);border:1px solid var(--border);}
.status-pill.in_transit{background:rgba(34,211,238,.16);color:var(--teal);border:1px solid var(--teal);}
.status-pill.delivered{background:rgba(74,222,128,.16);color:#4ade80;border:1px solid #4ade80;}
.status-pill.exception{background:var(--red-dim);color:#ff8f92;border:1px solid var(--red);}
.parcel-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-soft);}
.parcel-row:last-child{border-bottom:none;}
.parcel-row .info{flex:1;min-width:0;}
.parcel-row .info .n{font-weight:700;font-size:14px;}
.parcel-row .info .u{font-size:12px;color:var(--text-dim);margin-top:2px;}
.parcel-row .info .track{font-size:11.5px;color:var(--text-faint);font-family:var(--mono);margin-top:3px;}
.parcel-row .actions{display:flex;gap:6px;flex-shrink:0;align-items:center;}
.parcel-card{padding:14px 12px 14px 14px;border-bottom:1px solid var(--border-soft);border-left:4px solid var(--courier-accent, var(--border));border-radius:6px;margin-bottom:2px;--courier-accent:var(--teal);--courier-dark:var(--teal);--courier-bg:rgba(34,211,238,.12);}
.parcel-card:last-child{border-bottom:none;}
.parcel-card.parcel-card-outlined{border:1.5px solid var(--courier-accent);border-radius:10px;margin-bottom:10px;padding:14px 12px 14px 14px;}
.parcel-card.parcel-card-outlined:last-child{border:1.5px solid var(--courier-accent);}
.parcel-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:2px;}
.parcel-card-track{font-family:var(--mono);font-weight:800;font-size:18px;letter-spacing:.01em;color:var(--courier-accent);line-height:1.25;word-break:break-all;}
.parcel-card-track.none{color:var(--text-faint);font-weight:600;font-size:13px;}
.parcel-card-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;margin-top:2px;}
.parcel-card-courier{font-size:11.5px;color:var(--courier-accent);font-weight:700;margin-top:1px;text-transform:uppercase;letter-spacing:.03em;}
.parcel-card-trackbtn{width:auto !important;display:inline-flex;align-items:center;padding:8px 16px !important;font-size:12.5px !important;font-weight:800 !important;letter-spacing:.02em;margin-top:8px;gap:7px;background:var(--courier-accent) !important;border-color:var(--courier-accent) !important;color:#fff !important;box-shadow:0 2px 10px -2px var(--courier-accent);}
.parcel-card-trackbtn:active{background:var(--courier-dark) !important;border-color:var(--courier-dark) !important;}
.parcel-card-datetime{font-weight:700;font-size:13px;color:var(--text-dim);margin-top:7px;}
.parcel-card-name{font-weight:700;font-size:14.5px;margin-top:7px;}
.parcel-card-address{font-size:12px;color:var(--text-dim);margin-top:2px;}
.parcel-card-itemtable{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px;border:1px solid var(--border);}
.parcel-card-itemtable th,.parcel-card-itemtable td{border:1px solid var(--border);padding:5px 8px;text-align:left;}
.parcel-card-itemtable thead th{background:var(--courier-bg);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);font-weight:700;}
.parcel-card-itemtable th.num,.parcel-card-itemtable td.num{text-align:center;width:26px;color:var(--text-faint);}
.parcel-card-itemtable th.qty,.parcel-card-itemtable td.qty{text-align:center;width:46px;}
.parcel-card-itemtable td.desc{color:var(--text);}
.parcel-card-meta{font-size:11.5px;color:var(--text-faint);margin-top:7px;}
.weight-badge{display:inline-flex;align-items:baseline;gap:4px;font-family:var(--mono);background:linear-gradient(135deg,#F59E0B,#D97706);color:#1a1200;border-radius:7px;padding:4px 10px;margin-top:8px;box-shadow:0 2px 8px -2px rgba(217,119,6,.6);}
.weight-badge-num{font-size:18px;font-weight:900;line-height:1;}
.weight-badge-unit{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;}
.parcel-card-note{font-size:12px;color:var(--text-dim);margin-top:9px;font-style:italic;}


.request-row{padding:12px 0;border-bottom:1px solid var(--border-soft);}
.request-row:last-child{border-bottom:none;}
.request-row .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.request-row .qtybadge{font-family:var(--display);color:var(--yellow);font-weight:600;}
.status-pill{font-size:9.5px;font-weight:700;text-transform:uppercase;padding:3px 9px;border-radius:20px;letter-spacing:.04em;flex-shrink:0;}
.status-pill.pending{background:rgba(245,197,24,.15);color:var(--yellow);}
.status-pill.fulfilled{background:rgba(61,220,151,.15);color:var(--teal);}
.status-pill.dismissed{background:var(--panel2);color:var(--text-faint);border:1px solid var(--border);}

.img-upload{border:2px dashed var(--border);border-radius:10px;padding:18px;text-align:center;cursor:pointer;color:var(--text-dim);font-size:13px;position:relative;transition:border-color .15s,background .15s;}
.img-upload input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.img-upload.has-img{padding:0;border-style:solid;}
.img-upload.has-img img{width:100%;max-height:160px;object-fit:cover;border-radius:8px;display:block;}
.img-upload.drag-over{border-color:var(--yellow);background:rgba(245,197,24,.08);color:var(--text);}
.img-upload.has-img.drag-over{box-shadow:0 0 0 2px var(--yellow) inset;}

.history-day{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:700;margin:18px 0 6px;}
.history-day:first-child{margin-top:0;}

.link-btn{background:none;border:none;color:var(--yellow);font-weight:600;font-size:13px;cursor:pointer;padding:0;}
.sync-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--red-dim);
  border-bottom:1px solid var(--red);color:#ffcfd0;font-size:12.5px;font-weight:600;padding:9px 16px;}
.sync-banner span{display:flex;align-items:center;gap:6px;}
.sync-banner svg{width:15px;height:15px;flex-shrink:0;}
.sync-banner .link-btn{color:#fff;text-decoration:underline;flex-shrink:0;}
.footer-note{text-align:center;color:var(--text-faint);font-size:11px;margin-top:24px;line-height:1.6;}
.scan-label-box{background:var(--panel2);border:1px dashed var(--border);border-radius:10px;padding:14px;text-align:center;margin-bottom:16px;}
.scan-label-box .btn{width:auto;padding:11px 20px;}
.scan-label-box .hint{font-size:11.5px;color:var(--text-faint);margin-top:8px;line-height:1.5;}
.scan-label-box.reading .btn svg{animation:spin .9s linear infinite;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.item-rows-head{display:flex;align-items:center;gap:8px;padding:0 44px 4px 26px;}
.item-rows-head span:first-child{flex:1;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);font-weight:600;}
.item-rows-head span:last-child{width:56px;flex-shrink:0;text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);font-weight:600;}
.item-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
.item-row{display:flex;align-items:center;gap:8px;}
.item-row-num{width:18px;flex-shrink:0;text-align:center;font-size:12px;color:var(--text-faint);font-weight:700;}
.item-row .iDesc{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;outline:none;}
.item-row .iDesc:focus{border-color:var(--yellow);}
.item-row .iQty{width:56px;flex-shrink:0;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px 6px;border-radius:8px;font-size:14px;text-align:center;outline:none;}
.item-row .iQty:focus{border-color:var(--yellow);}
.item-row .removeItemBtn{width:36px;height:36px;flex-shrink:0;background:transparent;border:none;color:var(--text-faint);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.item-row .removeItemBtn svg{width:17px;height:17px;}
.item-row .removeItemBtn:hover{color:var(--red);}

/* ---------- floating notification popup ---------- */
#notifPopupHost{position:fixed;top:0;left:0;right:0;z-index:90;display:flex;flex-direction:column;align-items:center;
  pointer-events:none;padding-top:calc(10px + env(safe-area-inset-top));}
.notif-popup{pointer-events:auto;max-width:488px;width:calc(100% - 24px);margin:6px auto 0;background:var(--panel3);
  border:1px solid var(--yellow);border-radius:12px;padding:12px 12px 12px 14px;display:flex;gap:10px;align-items:flex-start;
  box-shadow:0 10px 30px rgba(0,0,0,.45);animation:notifin .25s ease-out;}
@keyframes notifin{from{transform:translateY(-16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.notif-popup-icon{width:32px;height:32px;border-radius:8px;background:rgba(245,197,24,.18);color:var(--yellow);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.notif-popup-icon svg{width:17px;height:17px;}
.notif-popup-body{flex:1;min-width:0;}
.notif-popup-body .t{font-weight:700;font-size:13.5px;}
.notif-popup-body .d{font-size:12.5px;color:var(--text-dim);margin-top:2px;}
.notif-popup-actions{display:flex;gap:16px;margin-top:9px;}
.notif-popup-close{background:none;border:none;color:var(--text-faint);cursor:pointer;padding:2px;flex-shrink:0;}
.notif-popup-close svg{width:16px;height:16px;display:block;}
</style>
</head>

/* =========================================================
   STORAGE HELPERS
   Backed by Supabase instead of window.storage, so this file
   works as a normal static site (e.g. on GitHub Pages) and not
   only inside a Claude artifact.

   Table needed in Supabase (SQL editor):

     create table kv_store (
       key text primary key,
       value jsonb,
       updated_at timestamptz default now()
     );
     alter table kv_store enable row level security;
     create policy "public read" on kv_store for select using (true);
     create policy "public write" on kv_store for insert with check (true);
     create policy "public update" on kv_store for update using (true);

   NOTE: these policies allow anyone with your anon key to read
   and write this table — the same trust model as the original
   "anyone with the link can edit" artifact. Tighten with real
   auth if you need it locked down further.

   'shared' keys (app:stock/app:users/app:requests) go to
   Supabase so the whole team sees them. 'personal' keys
   (session/theme) now live in localStorage — no need for a
   backend since each device only needs its own copy.
   ========================================================= */
async function storageGet(key, shared){
  if(!shared){
    try{ const v = localStorage.getItem('sf:'+key); return v ? JSON.parse(v) : null; }
    catch(e){ return null; }
  }
  try{
    const { data, error } = await supabaseClient.from('kv_store').select('value').eq('key', key).maybeSingle();
    if(error) throw error;
    return data ? data.value : null;
  }catch(e){ console.error('storage get failed', e); return null; }
}
async function storageSet(key, value, shared){
  if(!shared){
    try{ localStorage.setItem('sf:'+key, JSON.stringify(value)); return true; }
    catch(e){ return false; }
  }
  try{
    const { error } = await supabaseClient.from('kv_store').upsert({ key, value, updated_at: new Date().toISOString() });
    if(error) throw error;
    return true;
  }catch(e){ console.error('storage set failed', e); return false; }
}
// Retries a write a few times with backoff before giving up — a single transient
// failure should never silently drop data the person just entered.
async function storageSetReliable(key, value, shared, attempts){
  attempts = attempts || 3;
  for(let i=0;i<attempts;i++){
    const ok = await storageSet(key, value, shared);
    if(ok) return true;
    if(i < attempts-1) await new Promise(r=>setTimeout(r, 350*(i+1)));
  }
  return false;
}

let pendingWrites = 0;

async function loadStock(){
  const r = await storageGet('app:stock', true);
  return r || { products: [], history: [] };
}
async function saveStock(){
  pendingWrites++;
  const payload = { products: state.products, history: state.history };
  const ok = await storageSetReliable('app:stock', payload, true);
  pendingWrites--;
  if(ok){
    state.lastSnapshot = JSON.stringify(payload);

let audioCtx = null;
function playNotifSound(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    [ [880, now], [1175, now+0.12] ].forEach(([freq, t])=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.18, t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t+0.28);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t+0.3);
    });
  }catch(e){ /* audio not available — ignore */ }
}
let swRegistration = null;
async function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return null;
  try{
    swRegistration = await navigator.serviceWorker.register('sw.js');
    return swRegistration;
  }catch(e){ console.error('service worker registration failed', e); return null; }
}
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
// Subscribes this device to real push (delivers even if the tab/app is
// closed) and saves the subscription against the signed-in username so the
// backend knows who to wake up. Safe to call repeatedly.
async function subscribeToPush(){
  if(!swRegistration || !('PushManager' in window) || !state.currentUser) return;
  try{
    let sub = await swRegistration.pushManager.getSubscription();
    if(!sub){
      sub = await swRegistration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    await supabaseClient.from('push_subscriptions').upsert({
      username: state.currentUser.username,
      endpoint: sub.endpoint,
      subscription: sub.toJSON()
    }, { onConflict: 'endpoint' });
  }catch(e){ console.error('push subscribe failed', e); }
}
async function unsubscribeFromPush(){
  if(!swRegistration) return;
  try{
    const sub = await swRegistration.pushManager.getSubscription();
    if(sub){
      await supabaseClient.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
      await sub.unsubscribe();
    }
  }catch(e){ /* best-effort cleanup — ignore */ }
}
async function ensureNotifPermission(){
  await registerServiceWorker();
  if(!('Notification' in window)) return;
  if(Notification.permission === 'default'){
    try{ await Notification.requestPermission(); }catch(e){}
  }
  if(Notification.permission === 'granted') await subscribeToPush();
}
function sendSystemNotification(title, body){

  const opts = { body, icon: LOGO_ICON, badge: LOGO_ICON, tag: 'stockflow-'+Date.now(), vibrate: [120,60,120] };
  // Routed through the service worker when we have one — this is what
  // makes the OS banner + sound show up reliably on Android/desktop, and
  // is the ONLY way it works at all on an installed iOS home-screen app.
  if(swRegistration && swRegistration.showNotification){
    swRegistration.showNotification(title, opts).catch(()=>{});
  } else {

  }
}

function resizeImage(file, maxDim, quality){
  maxDim = maxDim || 320; quality = quality || 0.65;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Reads a photo of a courier shipping label (DPX, TNT, DHL, etc.) and asks
// Claude to pull out the structured fields, so the Add Parcel form can be
// filled automatically instead of retyping everything off the label.
//
// This calls a Supabase Edge Function ("extract-label") rather than
// api.anthropic.com directly — the Anthropic API needs a secret API key
// and doesn't accept anonymous calls straight from a browser, so the
// actual Claude call has to happen server-side. See
// supabase/functions/extract-label for the function to deploy.
async function extractShippingLabel(file){
  const dataUrl = await resizeImage(file, 1400, 0.85);
  const match = /^data:(image\/[a-zA-Z0-9.+-]+);base64,(.*)$/.exec(dataUrl);
  if(!match) throw new Error('Could not read the photo');
  const mediaType = match[1];
  const imageBase64 = match[2];
  const { data, error } = await supabaseClient.functions.invoke('extract-label', {
    body: { imageBase64, mediaType }
  });
  if(error) throw error;
  if(!data || typeof data !== 'object') throw new Error('Got an unreadable response');
  return data;
}

/* =========================================================
   REAL-TIME SYNC
   Supabase Realtime pushes changes to every connected device the
   moment a write lands, instead of waiting for the next poll.
   The interval below stays as a fallback in case a realtime
   event is missed (dropped connection, etc).
   ========================================================= */
let realtimeChannel = null;

async function refreshFromServer(){
  if(!state.currentUser) return;
  if(pendingWrites > 0 || state.syncFailed) return; // don't clobber local changes that aren't confirmed saved yet
  const stock = await loadStock();
  const snap = JSON.stringify(stock);
  if(snap !== state.lastSnapshot){
    state.lastSnapshot = snap;
    state.products = normalizeProducts(stock.products || []);
    state.history = stock.history || [];
    if(['dashboard','products','detail','history'].includes(state.view)) render();
  }
  const users = await loadUsers();
  if(users) state.users = users;

  const reqs = await loadRequests();
  const reqSnap = JSON.stringify(reqs);
  if(reqSnap !== state.lastRequestsSnapshot){
    const prevById = new Map(state.requests.map(r=>[r.id, r]));
    for(const r of reqs){
      const prev = prevById.get(r.id);
      if(!prev){
        // brand new request
        if(isAdmin()){
          showRequestPopup(r);
          sendSystemNotification(`${r.requestedByName} requested stock`, `${r.qty} × ${r.productName}${r.variantLabel?` (${r.variantLabel})`:''}${r.note?` — ${r.note}`:''}`);
        }
      } else if(prev.status === 'pending' && r.status !== 'pending' && !isAdmin() && r.requestedByUsername === state.currentUser.username){
        toast(`Your request for ${r.productName}${r.variantLabel?` (${r.variantLabel})`:''} was ${r.status}`, r.status==='fulfilled'?'success':'error');
        if(r.status === 'fulfilled'){
          sendSystemNotification('StockFlow', `Your request for ${r.productName}${r.variantLabel?` (${r.variantLabel})`:''} was fulfilled`);
        }
      }
    }
    state.lastRequestsSnapshot = reqSnap;
    state.requests = reqs;
    if(['dashboard','products','detail','history'].includes(state.view)) render();
  }

  const parcels = await loadParcels();
  const parcelSnap = JSON.stringify(parcels);
  if(parcelSnap !== state.lastParcelsSnapshot){
    const prevById = new Map(state.parcels.map(p=>[p.id, p]));
    for(const p of parcels){
      const prev = prevById.get(p.id);
      if(prev && prev.status !== 'delivered' && p.status === 'delivered'){
        toast(`${p.customerName}'s parcel was delivered`, 'success');
        sendSystemNotification('StockFlow', `Parcel for ${p.customerName} was delivered`);
      }
    }
    state.lastParcelsSnapshot = parcelSnap;
    state.parcels = parcels;
    if(state.view === 'parcels') render();
  }
}

function startPolling(){
  if(pollTimer) return;
  ensureNotifPermission();
  // Fallback polling — realtime handles the normal case near-instantly.
  pollTimer = setInterval(refreshFromServer, 4000);

  if(!realtimeChannel){
    realtimeChannel = supabaseClient
      .channel('kv_store_changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'kv_store' }, () => {
        refreshFromServer();
      })
      .subscribe();
  }
}

function bindMenuDrawer(){

  document.getElementById('menuThemeBtn').addEventListener('click', async ()=>{ closeModal(); await toggleTheme(); });
  document.getElementById('menuLogoutBtn').addEventListener('click', async ()=>{

function renderBottomNav(){

  switch(state.view){

  const totalProducts = state.products.length;
  const totalUnits = state.products.reduce((s,p)=>s+productTotalQty(p),0);
  const lowStock = state.products.filter(productIsLow);
  const todayKey = new Date().toDateString();
  const todaysMoves = state.history.filter(h=>dayKey(h.timestamp)===todayKey).length;
  const recent = [...state.history].sort((a,b)=>b.timestamp-a.timestamp).slice(0,8);
  const pendingReq = isAdmin() ? state.requests.filter(r=>r.status==='pending') : [];

  return `
  ${pendingReq.length ? `
  <div class="alert-banner" id="dashPendingReq" style="cursor:pointer;">

    <div>
      <div class="t">${pendingReq.length} stock request${pendingReq.length>1?'s':''} waiting</div>
      <div class="d">${pendingReq.slice(0,3).map(r=>`${esc(r.requestedByName)} wants ${r.qty} × ${esc(r.productName)}${r.variantLabel?` (${esc(r.variantLabel)})`:''}`).join(', ')}${pendingReq.length>3?` +${pendingReq.length-3} more`:''} — tap to review</div>

  ${lowStock.length ? `
  <div class="alert-banner" id="dashLowStockBanner" style="cursor:pointer;">
    <div class="alert-banner-icon">${iconAlert()}</div>
    <div>
      <div class="t">${lowStock.length} product${lowStock.length>1?'s':''} low on stock</div>
      <div class="d">${lowStock.slice(0,3).map(p=>esc(p.name)).join(', ')}${lowStock.length>3?` +${lowStock.length-3} more`:''} — tap to view</div>
    </div>
  </div>` : ''}

  <div class="stat-row three">
    <div class="stat-card" id="statProducts" style="cursor:pointer;"><div class="stat-icon blue">${iconBox()}</div><div class="num">${totalProducts}</div><div class="lbl">Products</div></div>
    <div class="stat-card" id="statUnits" style="cursor:pointer;"><div class="stat-icon green">${iconCheck()}</div><div class="num">${totalUnits}</div><div class="lbl">Units in stock</div></div>
    <div class="stat-card ${lowStock.length?'alert':''}" id="statLowStock" style="cursor:pointer;"><div class="stat-icon red">${iconAlert()}</div><div class="num">${lowStock.length}</div><div class="lbl">Low stock</div></div>

  <div class="footer-note">Data syncs across your team's devices automatically.</div>
  `;

function greetingForNow(){
  const h = new Date().getHours();
  if(h < 5) return 'Good Night';
  if(h < 12) return 'Good Morning';
  if(h < 17) return 'Good Afternoon';
  if(h < 21) return 'Good Evening';
  return 'Good Night';
}
function startGreetingClock(){
  setInterval(()=>{
    const el = document.querySelector('.dash-hero-text .greet');
    if(el) el.textContent = greetingForNow() + ',';
  }, 60000);
}
function renderFeedItem(h){
  const dt = fmtDateTime(h.timestamp);
  const isIn = h.type === 'manufactured';
  const img = h.productImage || (findProduct(h.productId)||{}).image || '';
  return `
  <div class="feed-item" data-history-id="${h.id}">
    ${img ? `<div class="feed-thumb"><img src="${img}" alt=""></div>` : `<div class="feed-dot ${isIn?'in':'out'}">${isIn ? iconIn() : iconOut()}</div>`}
    <div class="feed-body">
      <div class="t1">${img?`<span class="feed-dir ${isIn?'in':'out'}">${isIn ? iconIn() : iconOut()}</span>`:''}${isIn?'+':'−'}${h.qty} ${esc(h.productName)}${h.variantLabel?` <span class="faint" style="font-weight:500;">(${esc(h.variantLabel)})</span>`:''}</div>
      <div class="t2">${isIn?'Manufactured':'Sent'} by ${esc(h.user)}${h.note?` · ${esc(h.note)}`:''}</div>
      <div class="t3">${dt.full}</div>
    </div>
    ${isAdmin() ? `<button class="icon-btn feed-delete" data-delete-history="${h.id}" title="Delete activity">${iconTrash()}</button>` : ''}
  </div>`;
}

/* =========================================================
   PRODUCTS LIST
   ========================================================= */
function renderProducts(){
  const q = state.searchQuery.trim().toLowerCase();
  let list = state.products.filter(p=>{
    const variantText = (p.variants||[]).map(v=>`${v.color||''} ${v.size||''}`).join(' ').toLowerCase();
    if(q && !(p.name.toLowerCase().includes(q) || (p.sku||'').toLowerCase().includes(q) || (p.barcode||'').includes(q) || variantText.includes(q))) return false;
    if(state.filterCategory!=='all' && p.category!==state.filterCategory) return false;
    if(state.filterLowStock && !productIsLow(p)) return false;
    return true;
  }).sort((a,b)=>a.name.localeCompare(b.name));

  const activeLabel = state.filterLowStock ? 'Low stock' : (state.filterCategory==='all' ? 'All categories' : state.filterCategory);
  return `
  <div class="page-head"><div><h2>Products</h2><div class="sub">${state.products.length} total</div></div></div>
  <div class="search-bar">
    <input id="searchInput" type="text" placeholder="Search name, SKU or barcode…" value="${esc(state.searchQuery)}">
  </div>
  <button type="button" class="cat-select-bar" id="openCategoriesBtn">
    <span>${esc(activeLabel)}</span>
    ${iconChevronDown()}
  </button>
  ${list.length ? list.map(renderTicket).join('') : `
    <div class="empty">${wrapEmptyIcon(iconBox())}<div class="t">No products found</div><div class="d">${state.products.length? 'Try a different search or filter.' : (isAdmin() ? 'Tap the + button to add your first product.' : 'Ask an admin to add products.')}</div></div>
  `}
  `;
}
function renderTicket(p){
  const variants = p.variants||[];
  const low = productIsLow(p);
  const outCount = variants.filter(variantIsOut).length;
  const lowNotOutCount = variants.filter(v=>variantIsLow(v) && !variantIsOut(v)).length;
  const variantSummary = variants.length>1
    ? `${variants.length} variants`
    : (variants[0] && (variants[0].color||variants[0].size) ? esc(variantLabel(variants[0])) : '');

  let tagHtml;
  if (outCount>0) {
    tagHtml = `<span class="out-tag">${variants.length>1?`${outCount} out of stock`:'Out of stock'}</span>`;
  } else if (lowNotOutCount>0) {
    tagHtml = `<span class="low-tag">${variants.length>1?`${lowNotOutCount} low`:'Low stock'}</span>`;
  } else {
    tagHtml = `<span class="in-tag">In stock</span>`;
  }

  return `
  <div class="ticket ${low?'low':''}" data-open="${p.id}">
    ${low ? `<div class="hazard-edge"></div>` : ''}
    <div class="ticket-top">
      <div class="ticket-img">${p.image ? `<img src="${p.image}" alt="">` : iconBox()}</div>
      <div class="ticket-info">
        <div class="name">${esc(p.name)}</div>
        <div class="cat">${esc(p.category||'Uncategorized')}${variantSummary?` · ${variantSummary}`:''}</div>
        <div class="sku">SKU ${esc(p.sku||'—')}</div>
      </div>
      <div class="ticket-qty"><div class="n">${productTotalQty(p)}</div><div class="u">${esc(p.unit||'units')}</div></div>
    </div>
    <div class="ticket-divider"></div>
    <div class="ticket-bottom">
      <span class="code">⎯ ${esc(p.barcode)}</span>
      ${tagHtml}
    </div>
  </div>`;
}

   PARCEL CONTENTS (itemized description/qty rows, like a
   packing list) — used on the Add/Edit Parcel forms.
   ========================================================= */
function itemRowHtml(item, index){
  const id = item.id || uid('i');
  return `
  <div class="item-row" data-irow data-iid="${id}">
    <span class="item-row-num">${index+1}</span>
    <input class="iDesc" type="text" placeholder="e.g. Wool Hat" value="${esc(item.description||'')}">
    <input class="iQty" type="number" min="1" value="${item.qty||1}">
    <button type="button" class="removeItemBtn" title="Remove item">${iconTrash()}</button>
  </div>`;
}
function renumberItemRows(wrap){
  wrap.querySelectorAll('[data-irow]').forEach((row, i)=>{
    row.querySelector('.item-row-num').textContent = i+1;
  });
}
function bindItemRowsWrap(wrap, addBtn){
  function bindRow(row){
    row.querySelector('.removeItemBtn').addEventListener('click', ()=>{
      if(wrap.querySelectorAll('[data-irow]').length <= 1){
        row.querySelector('.iDesc').value = '';
        row.querySelector('.iQty').value = 1;
        return;
      }
      row.remove();
      renumberItemRows(wrap);
    });
  }
  wrap.querySelectorAll('[data-irow]').forEach(bindRow);
  addBtn.addEventListener('click', ()=>{
    const tmp = document.createElement('div');
    tmp.innerHTML = itemRowHtml({ id: uid('i'), description:'', qty:1 }, wrap.querySelectorAll('[data-irow]').length).trim();
    const row = tmp.firstElementChild;
    wrap.appendChild(row);
    bindRow(row);
    row.querySelector('.iDesc').focus();
  });
}
function collectItems(wrap){
  return Array.from(wrap.querySelectorAll('[data-irow]')).map(row=>({
    id: row.getAttribute('data-iid') || uid('i'),
    description: row.querySelector('.iDesc').value.trim(),
    qty: Math.max(1, parseInt(row.querySelector('.iQty').value, 10) || 1)
  })).filter(it=>it.description);
}
function replaceItemRows(wrap, items, addBtn){
  wrap.innerHTML = (items && items.length ? items : [{id:uid('i'),description:'',qty:1}])
    .map((it,i)=>itemRowHtml(it,i)).join('');
  bindItemRowsWrap(wrap, addBtn);
}

function variantRowHtml(v, isExisting){
  const vid = v.id || uid('v');
  const qty = v.qty||0;

  const isOtherColor = v.color && !COLOR_OPTIONS.includes(v.color);
  return `

    <div class="field-row">
      <div class="field">
        <label>Color</label>
        <select class="vColor">${colorOptions(v.color)}</select>

          </label>
          <input type="text" class="vColorHexText" placeholder="#RRGGBB" maxlength="7" value="${esc(v.colorHex||'')}">
        </div>
        <input type="hidden" class="vColorHex" value="${esc(v.colorHex||'')}">
      </div>
      <div class="field">
        <label>Size</label>
        <select class="vSize">${sizeOptions(v.size)}</select>
        <input class="vSizeOther" type="text" placeholder="Enter size" value="${v.size && !SIZE_OPTIONS.includes(v.size)?esc(v.size):''}" style="margin-top:6px;${v.size && !SIZE_OPTIONS.includes(v.size)?'':'display:none;'}">

    </div>
    <div class="field-row">
      <div class="field">
        <label>${isExisting?'Quantity':'Starting quantity'}</label>
        <input class="vQty" type="number" min="0" value="${qty}" ${isExisting?'disabled title="Use + Add Manufactured / − Send Stock on the product page to change stock"':''}>

function renderBarcodeInto(elId, product){
  if(!product) return;
  const svg = document.getElementById(elId);
  if(!svg) return;

function renderScan(){

  <div class="page-head"><div><h2>Scan Barcode</h2><div class="sub">Point your camera at a product barcode</div></div></div>
  <div class="scan-frame">

  </div>
  <div class="section-title">Or enter code manually</div>
  <div class="manual-entry">
    <input id="manualCode" type="text" placeholder="Type or paste a barcode/SKU">
    <button class="btn btn-primary btn-sm" id="manualLookupBtn" style="width:auto;">Find</button>
  </div>
  <div class="footer-note">Camera access needs permission from your browser. If scanning doesn't start, use manual entry above.</div>
  `;
}
let scannerStarting = false;
async function initScanner(){
  const placeholder = document.getElementById('scanPlaceholder');
  if(!window.Html5Qrcode){
    if(placeholder) placeholder.innerHTML = `${iconAlert()}<div style="margin-top:8px;">Camera scanner unavailable. Use manual entry below.</div>`;
    return;
  }
  if(scannerInstance || scannerStarting) return; // already running/starting — avoid duplicate camera sessions
  scannerStarting = true;
  const config = { fps:10, qrbox:{width:240,height:150} };
  const onScan = (decodedText)=>{ handleScanResult(decodedText); };
  const onScanErr = ()=>{ /* ignore per-frame scan errors */ };

  let inst;
  try{
    inst = new Html5Qrcode('reader');
  }catch(e){
    scannerStarting = false;
    if(placeholder) placeholder.innerHTML = `${iconAlert()}<div style="margin-top:8px;">Scanner failed to start. Use manual entry below.</div>`;
    return;
  }

  const finish = ()=>{ scannerInstance = inst; scannerStarting = false; if(placeholder) placeholder.style.display='none'; };

  try{
    // Preferred: ask directly for the rear camera.
    await inst.start({ facingMode:{ exact:'environment' } }, config, onScan, onScanErr);
    finish();
    return;
  }catch(err1){
    // Many browsers (iOS Safari, some Android WebViews) don't honor facingMode reliably —
    // fall back to enumerating cameras and picking the back one by id.
    try{
      const cameras = await Html5Qrcode.getCameras();
      if(!cameras || !cameras.length) throw new Error('no-camera');
      const back = cameras.find(c=>/back|rear|environment/i.test(c.label)) || cameras[cameras.length-1];
      await inst.start(back.id, config, onScan, onScanErr);
      finish();
      return;
    }catch(err2){
      scannerStarting = false;
      const denied = (err1 && err1.name==='NotAllowedError') || (err2 && err2.name==='NotAllowedError');
      const msg = denied
        ? "Camera permission was blocked. Allow camera access for this site in your browser settings, then reload."
        : "Couldn't access camera. Use manual entry below.";
      if(placeholder) placeholder.innerHTML = `${iconAlert()}<div style="margin-top:8px;">${msg}</div>`;
      try{ await inst.clear(); }catch(e){}
    }
  }
}
function stopScanner(){
  const inst = scannerInstance;
  scannerInstance = null;
  scannerStarting = false;
  if(inst){
    try{ inst.stop().then(()=>inst.clear()).catch(()=>{ try{ inst.clear(); }catch(e){} }); }catch(e){}
  }
}
function handleScanResult(code){
  stopScanner();
  lookupCode(code);
}
function lookupCode(code){
  stopScanner();
  const clean = String(code).trim();
  const p = state.products.find(x=>x.barcode===clean || (x.sku||'').toLowerCase()===clean.toLowerCase());
  if(p){
    state.selectedProductId = p.id;
    state.view = 'detail';
    render();
    toast(`Found: ${p.name}`, 'success');
  } else {
    if(isAdmin()){
      state.editingProductId = null;
      state.view = 'addProduct';
      render();
      setTimeout(()=>{ const bc=document.getElementById('fBarcode'); if(bc) bc.value = clean; }, 30);
      toast('No match — creating a new product', 'error');
    } else {
      toast('No product found for that code', 'error');
    }
  }
}

const STATUS_LABEL = { pending:'Pending', in_transit:'In Transit', delivered:'Delivered', exception:'Exception' };

function courierTheme(courier){
  const c = (courier||'').toLowerCase();
  if(c.includes('dpex') || c.includes('dpx')) return { accent:'#3B82F6', dark:'#1D4ED8', bg:'rgba(59,130,246,.14)' };
  if(c.includes('sky net') || c.includes('skynet') || c.includes('sky-net')) return { accent:'#EF4444', dark:'#B91C1C', bg:'rgba(239,68,68,.14)' };
  return null;
}
function normalizeUrl(u){
  if(!u) return u;
  u = u.trim();
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u.replace(/^\/+/, '');
  return u;
}
function trackShipment(p){
  const courierKey = (p.courier||'').trim().toLowerCase();
  const tpl = courierKey ? state.trackingLinks[courierKey] : null;
  let url;
  if(tpl && tpl.url){
    const hasPlaceholder = tpl.url.includes('{tracking}');
    const raw = hasPlaceholder ? tpl.url.replace('{tracking}', encodeURIComponent(p.trackingNumber||'')) : tpl.url;
    url = normalizeUrl(raw);
    if(!hasPlaceholder && isAdmin()) toast(`The saved link for "${tpl.label}" has no {tracking} placeholder, so every parcel opens the same page — edit it below to fix this`, 'error');
  } else {
    url = `https://www.google.com/search?q=${encodeURIComponent((p.courier?p.courier+' ':'')+'tracking '+(p.trackingNumber||''))}`;
    if(isAdmin() && p.courier) toast(`No tracking link saved for "${p.courier}" yet — add one below`, 'error');
  }
  window.open(url, '_blank', 'noopener');
}

function bindParcelsView(){

  const filterFrom = document.getElementById('parcelFilterFrom');
  if(filterFrom) filterFrom.addEventListener('change', e=>{ state.filterParcelDateFrom = e.target.value; render(); });
  const filterTo = document.getElementById('parcelFilterTo');
  if(filterTo) filterTo.addEventListener('change', e=>{ state.filterParcelDateTo = e.target.value; render(); });
  const filterCustomer = document.getElementById('parcelFilterCustomer');
  if(filterCustomer) filterCustomer.addEventListener('input', e=>{
    state.filterParcelCustomer = e.target.value;
    render();
    const el = document.getElementById('parcelFilterCustomer');
    if(el){ el.focus(); el.setSelectionRange(state.filterParcelCustomer.length, state.filterParcelCustomer.length); }
  });
  const filterClearBtn = document.getElementById('parcelFilterClearBtn');
  if(filterClearBtn) filterClearBtn.addEventListener('click', ()=>{
    state.filterParcelCourier = 'all'; state.filterParcelDateFrom = ''; state.filterParcelDateTo = ''; state.filterParcelCustomer = ''; render();
  });
  document.querySelectorAll('[data-trackparcel]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const p = state.parcels.find(x=>x.id===b.getAttribute('data-trackparcel'));
      if(p) trackShipment(p);
    });
  });
  document.querySelectorAll('[data-editparcel]').forEach(b=>{
    b.addEventListener('click', ()=> openEditParcelModal(b.getAttribute('data-editparcel')));
  });
  document.querySelectorAll('[data-delparcel]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.getAttribute('data-delparcel');
      const p = state.parcels.find(x=>x.id===id);
      if(!p) return;
      openConfirmModal({
        title: 'Delete parcel?',
        message: `Delete the parcel for ${p.customerName}? This cannot be undone.`,
        confirmLabel: 'Delete',
        danger: true,
        onConfirm: async ()=>{
          state.parcels = state.parcels.filter(x=>x.id!==id);
          const ok = await saveParcels();
          state.view='parcels'; state.modal=null;
          render();
          toast(ok ? 'Parcel deleted' : "Deleted locally, but couldn't sync — tap Retry sync at the top", ok?'success':'error');
        }
      });
    });
  });
  document.querySelectorAll('[data-deladdress]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.getAttribute('data-deladdress');
      const a = state.savedAddresses.find(x=>x.id===id);
      if(!a) return;
      openConfirmModal({
        title: 'Delete saved address?',
        message: `Delete the saved address for ${a.customerName}? This cannot be undone.`,
        confirmLabel: 'Delete',
        danger: true,
        onConfirm: async ()=>{
          state.savedAddresses = state.savedAddresses.filter(x=>x.id!==id);
          const ok = await saveSavedAddresses();
          state.modal=null;
          render();
          toast(ok ? 'Saved address deleted' : "Deleted locally, but couldn't sync — tap Retry sync at the top", ok?'success':'error');
        }
      });
    });
  });
  document.querySelectorAll('[data-deltrackinglink]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const key = b.getAttribute('data-deltrackinglink');
      const t = state.trackingLinks[key];
      if(!t) return;
      openConfirmModal({
        title: 'Delete tracking link?',
        message: `Delete the tracking link for ${t.label}? This cannot be undone.`,
        confirmLabel: 'Delete',
        danger: true,
        onConfirm: async ()=>{
          delete state.trackingLinks[key];
          const ok = await saveTrackingLinks();
          state.modal=null;
          render();
          toast(ok ? 'Tracking link deleted' : "Deleted locally, but couldn't sync — tap Retry sync at the top", ok?'success':'error');
        }
      });
    });
  });
  const tlAddBtn = document.getElementById('tlAddBtn');
  if(tlAddBtn) tlAddBtn.addEventListener('click', async ()=>{
    const courier = document.getElementById('tlCourier').value.trim();
    const url = normalizeUrl(document.getElementById('tlUrl').value.trim());
    if(!courier || !url){ toast('Enter a courier name and a tracking URL', 'error'); return; }
    if(!url.includes('{tracking}')){
      toast('The URL must include {tracking} where the tracking number goes, e.g. https://dpex.com/track?awb={tracking} — otherwise every parcel for this courier will open the same page', 'error');
      return;
    }
    tlAddBtn.disabled = true;
    state.trackingLinks[courier.toLowerCase()] = { label: courier, url };
    const ok = await saveTrackingLinks();
    tlAddBtn.disabled = false;
    if(!ok){ toast("Saved locally, but couldn't sync — tap Retry sync at the top", 'error'); render(); return; }
    toast('Tracking link saved — it will apply to every parcel with this courier', 'success');
    render();
  });
  const scanBtn = document.getElementById('scanLabelBtn');
  const scanInput = document.getElementById('labelPhotoInput');
  const scanBox = document.getElementById('scanLabelBox');
  const scanHint = document.getElementById('scanLabelHint');
  const pItemRows = document.getElementById('pItemRows');
  const addItemBtn = document.getElementById('addItemBtn');
  if(pItemRows && addItemBtn) bindItemRowsWrap(pItemRows, addItemBtn);
  const savedAddrSel = document.getElementById('pSavedAddress');
  if(savedAddrSel){
    savedAddrSel.addEventListener('change', ()=>{
      const a = state.savedAddresses.find(x=>x.id===savedAddrSel.value);
      if(!a) return;
      document.getElementById('pCustomer').value = a.customerName || '';
      document.getElementById('pAddress').value = a.address || '';
      document.getElementById('pPhone').value = a.phone || '';
      if(a.courier) document.getElementById('pCourier').value = a.courier;
      savedAddrSel.value = '';
    });
  }
  if(scanBtn && scanInput){
    scanBtn.addEventListener('click', ()=> scanInput.click());
    scanInput.addEventListener('change', async ()=>{
      const file = scanInput.files && scanInput.files[0];
      scanInput.value = '';
      if(!file) return;
      scanBox.classList.add('reading');
      scanBtn.disabled = true;
      const origLabel = scanBtn.innerHTML;
      scanBtn.innerHTML = `${iconCamera()} Reading label…`;
      scanHint.textContent = 'Give it a few seconds — reading the label with AI.';
      try{
        const fields = await extractShippingLabel(file);
        const set = (id, val)=>{ const el = document.getElementById(id); if(el && val !== undefined && val !== null && val !== '' && val !== 0) el.value = val; };
        set('pCustomer', fields.customerName);
        set('pAddress', fields.address);
        set('pPhone', fields.phone);
        set('pNote', fields.note);
        set('pCourier', fields.courier);
        set('pTracking', fields.trackingNumber);
        if(fields.pieces) document.getElementById('pPieces').value = fields.pieces;
        if(fields.weightKg) document.getElementById('pWeight').value = fields.weightKg;
        if(fields.items && fields.items.length){
          replaceItemRows(pItemRows, fields.items.map(i=>({ id: uid('i'), description: i.description||'', qty: i.qty||1 })), addItemBtn);
        }
        scanHint.textContent = 'Filled in from the label — check the details, then tap Add Parcel.';
        toast('Label read — review the details below', 'success');
      }catch(err){
        console.error('Label scan failed', err);
        scanHint.textContent = `Couldn't read that photo — ${err && err.message ? err.message : 'try again'}, or fill in the fields manually.`;
        toast("Couldn't read the label — fill in the fields manually", 'error');
      }finally{
        scanBox.classList.remove('reading');
        scanBtn.disabled = false;
        scanBtn.innerHTML = origLabel;
      }
    });
  }
  const addBtn = document.getElementById('addParcelBtn');
  if(addBtn) addBtn.addEventListener('click', async (e)=>{
    const customerName = document.getElementById('pCustomer').value.trim();
    const address = document.getElementById('pAddress').value.trim();
    const phone = document.getElementById('pPhone').value.trim();
    const note = document.getElementById('pNote').value.trim();
    const courier = document.getElementById('pCourier').value.trim();
    const trackingNumber = document.getElementById('pTracking').value.trim();
    const pieces = Math.max(1, parseInt(document.getElementById('pPieces').value, 10) || 1);
    const weightKg = parseFloat(document.getElementById('pWeight').value) || 0;
    const items = pItemRows ? collectItems(pItemRows) : [];
    if(!customerName){ toast('Customer name is required', 'error'); return; }
    const saveAddrEl = document.getElementById('pSaveAddress');
    const shouldSaveAddress = !!(saveAddrEl && saveAddrEl.checked);
    const btn = e.currentTarget; btn.disabled = true;
    const parcel = {
      id: uid('p'), customerName, address, phone, note, courier, trackingNumber, pieces, weightKg, items,
      status: trackingNumber ? 'in_transit' : 'pending',
      addedByUsername: state.currentUser.username, addedByName: state.currentUser.name,
      createdAt: Date.now(), deliveredAt: null,
    };
    state.parcels.push(parcel);
    const ok = await saveParcels();
    if(shouldSaveAddress){
      const key = (customerName+'|'+address).toLowerCase();
      const existing = state.savedAddresses.find(a=>(a.customerName+'|'+a.address).toLowerCase()===key);
      if(existing){
        existing.phone = phone; existing.courier = courier;
      } else {
        state.savedAddresses.push({ id: uid('a'), customerName, address, phone, courier, createdAt: Date.now() });
      }
      await saveSavedAddresses();
    }
    btn.disabled = false;
    if(!ok){ toast("Saved locally, but couldn't sync — tap Retry sync at the top", 'error'); render(); return; }
    toast(shouldSaveAddress ? 'Parcel added and address saved' : 'Parcel added', 'success');
    render();
  });
}

function bindEditParcelModal(parcelId){
  const overlay = document.getElementById('modalOverlay');
  overlay.addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  const epItemRows = document.getElementById('epItemRows');
  const epAddItemBtn = document.getElementById('epAddItemBtn');
  if(epItemRows && epAddItemBtn) bindItemRowsWrap(epItemRows, epAddItemBtn);
  document.getElementById('saveEditParcelBtn').addEventListener('click', async (e)=>{
    const p = state.parcels.find(x=>x.id===parcelId);
    if(!p) return;
    const customerName = document.getElementById('epCustomer').value.trim();
    const address = document.getElementById('epAddress').value.trim();
    const phone = document.getElementById('epPhone').value.trim();
    const note = document.getElementById('epNote').value.trim();
    const courier = document.getElementById('epCourier').value.trim();
    const trackingNumber = document.getElementById('epTracking').value.trim();
    const pieces = Math.max(1, parseInt(document.getElementById('epPieces').value, 10) || 1);
    const weightKg = parseFloat(document.getElementById('epWeight').value) || 0;
    const items = epItemRows ? collectItems(epItemRows) : (p.items||[]);
    const status = document.getElementById('epStatus').value;
    if(!customerName){ toast('Customer name is required', 'error'); return; }
    const dateVal = document.getElementById('epDate').value;
    const timeVal = document.getElementById('epTime').value;
    let createdAt = p.createdAt;
    if(dateVal && timeVal){
      const combined = new Date(`${dateVal}T${timeVal}`).getTime();
      if(!isNaN(combined)) createdAt = combined;
    }
    const btn = e.currentTarget; btn.disabled = true;
    const wasDelivered = p.status === 'delivered';
    p.customerName = customerName; p.address = address; p.phone = phone; p.note = note;
    p.courier = courier; p.trackingNumber = trackingNumber; p.pieces = pieces; p.weightKg = weightKg; p.items = items;
    p.status = status; p.createdAt = createdAt;
    if(status === 'delivered' && !wasDelivered) p.deliveredAt = Date.now();
    if(status !== 'delivered') p.deliveredAt = null;
    const ok = await saveParcels();
    if(!ok){ btn.disabled = false; toast("Saved locally, but couldn't sync — tap Retry sync at the top", 'error'); return; }
    toast('Parcel updated', 'success');
    closeModal();
  });
}

function openStockModal(type, variantId){
  const p = findProduct(state.selectedProductId);
